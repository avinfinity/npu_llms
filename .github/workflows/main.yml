name: Build Installer

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build EXE installer
        shell: pwsh
        run: .\packaging\build-windows.ps1

      - name: Verify installer exists
        shell: pwsh
        run: |
          if (-not (Test-Path .\dist\npu-setup.exe)) {
            throw "Installer was not created"
          }

      # Optional: upload installer as workflow artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: npu-installer
          path: .\dist\npu-setup.exe

      # Create GitHub release only for version tags
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            .\dist\npu-setup.exe `
            --generate-notes
