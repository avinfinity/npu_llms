[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npu"
version = "0.1.1"
description = "Local runtime for NPU-optimized OpenVINO LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "NPU Contributors" }]
dependencies = [
  "fastapi>=0.111",
  "huggingface-hub>=0.24",
  "uvicorn[standard]>=0.29",
  "openvino-genai>=2025.0",
  "openvino-tokenizers>=2025.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8",
]
windows-installer = [
  "pyinstaller>=6.6",
]

[project.scripts]
npu = "npu.cli:main"

[tool.setuptools.packages.find]
include = ["npu*"]

[tool.setuptools.package-data]
npu = ["static/*.html", "data/*.json"]
