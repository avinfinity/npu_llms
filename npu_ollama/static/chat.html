<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NPU Ollama Chat</title>
  <style>
    :root { color-scheme: light dark; font-family: Segoe UI, Arial, sans-serif; }
    body { margin: 0; background: #f6f7f9; color: #17191c; }
    main { height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid #d7dbe2; background: #ffffff; }
    h1 { font-size: 17px; margin: 0; font-weight: 650; }
    select, textarea, button { font: inherit; }
    #chat { overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 860px; padding: 10px 12px; border: 1px solid #d7dbe2; border-radius: 8px; white-space: pre-wrap; line-height: 1.45; }
    .user { align-self: flex-end; background: #e9f2ff; }
    .assistant { align-self: flex-start; background: #ffffff; }
    form { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 14px 18px; border-top: 1px solid #d7dbe2; background: #ffffff; }
    textarea { resize: none; min-height: 46px; max-height: 150px; padding: 10px; border: 1px solid #b8c0cc; border-radius: 6px; }
    button { min-width: 84px; border: 0; border-radius: 6px; background: #1264a3; color: white; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    @media (prefers-color-scheme: dark) {
      body { background: #14161a; color: #eef1f5; }
      header, form, .assistant { background: #1d2026; }
      header, form, .msg, textarea { border-color: #343944; }
      textarea { background: #14161a; color: #eef1f5; }
      .user { background: #16344d; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>NPU Ollama Chat</h1>
    <select id="model"></select>
  </header>
  <section id="chat"></section>
  <form id="form">
    <textarea id="prompt" placeholder="Message the local NPU model" required></textarea>
    <button id="send">Send</button>
  </form>
</main>
<script>
const chat = document.querySelector("#chat");
const form = document.querySelector("#form");
const promptBox = document.querySelector("#prompt");
const send = document.querySelector("#send");
const modelSelect = document.querySelector("#model");
const messages = [];

function add(role, content) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = content;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

async function loadModels() {
  const response = await fetch("/api/tags");
  const body = await response.json();
  modelSelect.replaceChildren(...body.models.map((model) => {
    const option = document.createElement("option");
    option.value = model.name;
    option.textContent = model.name;
    return option;
  }));
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = promptBox.value.trim();
  if (!text) return;
  promptBox.value = "";
  send.disabled = true;
  messages.push({role: "user", content: text});
  add("user", text);
  const assistant = add("assistant", "");
  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({model: modelSelect.value, stream: false, messages})
    });
    const body = await response.json();
    const reply = body.message?.content || body.detail || "";
    assistant.textContent = reply;
    messages.push({role: "assistant", content: reply});
  } catch (error) {
    assistant.textContent = String(error);
  } finally {
    send.disabled = false;
    promptBox.focus();
  }
});

loadModels().catch((error) => add("assistant", String(error)));
</script>
</body>
</html>
